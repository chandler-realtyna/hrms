name: 🚀 Deploy to Production

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - version-16          # Auto-deploy every push to version-16
  workflow_dispatch:        # Also allow a manual "Run workflow" click in GitHub UI
    inputs:
      reason:
        description: "Reason for manual deploy (optional)"
        required: false
        default: "Manual trigger"

# ──────────────────────────────────────────────────────────────────────────────
# Global env
# ──────────────────────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. chandler-realtyna/hrms
  FRAPPE_BRANCH: version-16

# Only one deploy at a time — never cancel a running deploy
concurrency:
  group: deploy-production
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
# Job 1 — Build a custom Docker image and push it to GHCR
# ──────────────────────────────────────────────────────────────────────────────
#
#   Uses the same frappe_docker "layered" Containerfile approach as the existing
#   build_image.yml, but with apps-production.json which points to the Realtyna
#   HRMS fork instead of upstream frappe/hrms.
#
#   Required repository secrets (Settings → Secrets → Actions):
#     None — GITHUB_TOKEN is sufficient for pushing to GHCR.
#
jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # Needed to push to ghcr.io

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout HRMS repository
        uses: actions/checkout@v4

      # Enable multi-platform builds (we target amd64 only for speed)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Encode our Realtyna-specific apps list as base64 ──────────────────
      - name: Encode apps-production.json
        run: |
          APPS_JSON_PATH="${GITHUB_WORKSPACE}/.github/helper/apps-production.json"
          echo "APPS_JSON_BASE64=$(base64 -w0 < "$APPS_JSON_PATH")" >> "$GITHUB_ENV"

      # ── Fetch the official frappe_docker repo (provides Containerfile) ────
      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker_build

      # ── Build + push ───────────────────────────────────────────────────────
      #   Tags:
      #     ghcr.io/chandler-realtyna/hrms:production  ← always points to latest
      #     ghcr.io/chandler-realtyna/hrms:<git-sha>   ← immutable, for rollback
      #
      #   Layer caching: pulls the previous "production" image as cache source
      #   so only changed layers are rebuilt (typically just the app code layer).
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: frappe_docker_build
          file: frappe_docker_build/images/layered/Containerfile
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production
          cache-to: type=inline

      - name: Print image digest
        run: echo "✅ Image pushed — digest ${{ steps.push.outputs.digest }}"

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2 — SSH into the production server and deploy
  # ──────────────────────────────────────────────────────────────────────────────
  #
  #   What happens on the server:
  #     1. Pull the newly-pushed image
  #     2. Recreate app containers (DB and Redis are left running)
  #     3. Wait for backend to start
  #     4. bench migrate   — apply any DB schema changes
  #     5. bench clear-cache — flush stale bytecode/cache
  #
  #   Required repository secrets (Settings → Secrets → Actions):
  #     PROD_SSH_HOST     — server IP or hostname (e.g. 95.216.x.x)
  #     PROD_SSH_USER     — SSH login user (e.g. frappe, ubuntu, root)
  #     PROD_SSH_KEY      — private SSH key (paste the full -----BEGIN… block)
  #     PROD_SSH_PORT     — SSH port (set to 22 if you use the default)
  #     PROD_SITE_NAME    — Frappe site name (e.g. hr.yourcompany.com)
  #     PROD_COMPOSE_PATH — absolute path to docker-compose.yml on the server
  #                         (e.g. /home/frappe/frappe-bench)
  #     GHCR_TOKEN        — GitHub Personal Access Token with read:packages scope
  #                         (so the server can pull private images from GHCR)
  #
  #   Optional: set up a GitHub "production" environment (Settings → Environments)
  #   to require a manual approval before this job runs.
  #
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production   # Remove this line if you don't want an approval gate

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN:   ${{ secrets.GHCR_TOKEN }}
          GH_ACTOR:     ${{ github.actor }}
          SITE_NAME:    ${{ secrets.PROD_SITE_NAME }}
          COMPOSE_PATH: ${{ secrets.PROD_COMPOSE_PATH }}
        with:
          host:     ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          port:     ${{ secrets.PROD_SSH_PORT }}
          envs:     GHCR_TOKEN,GH_ACTOR,SITE_NAME,COMPOSE_PATH
          script: |
            set -euo pipefail

            echo "──────────────────────────────────────────────"
            echo " Realtyna HRMS — Production Deploy"
            echo " $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "──────────────────────────────────────────────"

            echo "📁  Entering compose directory: $COMPOSE_PATH"
            cd "$COMPOSE_PATH"

            echo "🔑  Authenticating with GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "⬇️   Pulling new image..."
            docker compose pull

            echo "🔄  Restarting application containers..."
            echo "    (DB and Redis are NOT restarted — zero downtime for data layer)"
            docker compose up -d --no-deps --force-recreate \
              backend \
              frontend \
              websocket \
              worker_short \
              worker_long \
              worker_default \
              scheduler

            echo "⏳  Waiting 20s for backend to initialise..."
            sleep 20

            echo "🗄️   Running Frappe database migrations..."
            docker compose exec -T backend \
              bench --site "$SITE_NAME" migrate

            echo "🧹  Clearing application cache..."
            docker compose exec -T backend \
              bench --site "$SITE_NAME" clear-cache

            echo ""
            echo "✅  Deployment complete — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "──────────────────────────────────────────────"
