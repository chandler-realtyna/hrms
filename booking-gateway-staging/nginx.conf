# Isolated public booking gateway for book.realtyna.com.
#
# Design (deny by default):
#  - Listens on 127.0.0.1:8090 ONLY. Public TLS + hostname mapping is done
#    in Cloudflare (book.realtyna.com -> this port). Nothing else is exposed.
#  - Allows ONLY what the public booking page needs:
#      * short links /<slug> (rewritten internally to /hrms/book/<slug>)
#      * single-use links /<slug>/<token> (rewritten to /hrms/book/<slug>/<token>;
#        the token is validated server-side and dies with the first meeting)
#      * the booking shell page (/hrms/book/*, in case of direct hits)
#      * the 3 guest booking APIs (page info, slots, create)
#      * static bundles/icons/avatars the page loads
#  - Everything else (desk, login, all other /api/*, socket.io, /files
#    writes, any other method) -> 403.
#  - Stateless: client cookies are dropped, Set-Cookie stripped. The gateway
#    can only ever act as Guest. No DB access, no API keys, no secrets.
#  - Rate limits per IP + access logs (request line only, never bodies).

user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
	worker_connections 256;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	server_tokens off;

	log_format booking '$remote_addr|$http_x_forwarded_for|[$time_local]|$request|$status|$body_bytes_sent|$http_referer|$http_user_agent';
	access_log /var/log/booking-gateway/access.log booking;

	limit_req_zone $binary_remote_addr zone=page:1m   rate=30r/m;
	limit_req_zone $binary_remote_addr zone=read:1m   rate=30r/m;
	limit_req_zone $binary_remote_addr zone=book:1m   rate=5r/m;
	limit_req_zone $binary_remote_addr zone=static:1m rate=120r/m;
	limit_req_status 429;
	limit_req_log_level warn;

	# Resolved at request time (tolerates ERPNext restarts).
	resolver 127.0.0.11 valid=10s;

	server {
		listen 8090;
		server_name _;

		set $upstream http://frontend:8080;

		client_max_body_size 256k;
		client_body_timeout 10s;
		proxy_connect_timeout 5s;
		proxy_send_timeout 10s;
		proxy_read_timeout 30s;
		proxy_http_version 1.1;

		# Force guest treatment: no session can pass through this gateway.
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_hide_header Server;
		proxy_set_header Host hr.realtyna.com;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		add_header X-Content-Type-Options nosniff always;

		# ── Booking shell page ───────────────────────────────
		location ^~ /hrms/book/ {
			limit_except GET HEAD OPTIONS { deny all; }
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=page burst=10 nodelay;
			proxy_pass $upstream;
		}

		# ── Booking APIs (exact match, nothing else under /api) ──
		# CORS preflight needs explicit allow headers: same-origin page sends
		# X-Frappe-CSRF-Token when the visitor is logged in.
		location = /api/method/hrms.api.calendar.get_booking_page_info {
			limit_except GET POST HEAD OPTIONS { deny all; }
			add_header Access-Control-Allow-Origin $http_origin always;
			add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS" always;
			add_header Access-Control-Allow-Headers "Content-Type, X-Frappe-CSRF-Token" always;
			add_header Access-Control-Max-Age 86400 always;
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=read burst=10 nodelay;
			proxy_pass $upstream;
		}
		location = /api/method/hrms.api.calendar.get_available_slots {
			limit_except GET POST HEAD OPTIONS { deny all; }
			add_header Access-Control-Allow-Origin $http_origin always;
			add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS" always;
			add_header Access-Control-Allow-Headers "Content-Type, X-Frappe-CSRF-Token" always;
			add_header Access-Control-Max-Age 86400 always;
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=read burst=10 nodelay;
			proxy_pass $upstream;
		}
		location = /api/method/hrms.api.calendar.create_booking {
			limit_except POST OPTIONS { deny all; }
			add_header Access-Control-Allow-Origin $http_origin always;
			add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
			add_header Access-Control-Allow-Headers "Content-Type, X-Frappe-CSRF-Token" always;
			add_header Access-Control-Max-Age 86400 always;
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=book burst=2 nodelay;
			proxy_pass $upstream;
		}

		# ── Static assets the booking page loads ──────────────
		location ^~ /assets/hrms/frontend/ {
			limit_except GET HEAD OPTIONS { deny all; }
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=static burst=60 nodelay;
			proxy_pass $upstream;
		}
		location ^~ /assets/hrms/manifest/ {
			limit_except GET HEAD OPTIONS { deny all; }
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=static burst=60 nodelay;
			proxy_pass $upstream;
		}
		location ^~ /assets/hrms/icons/ {
			limit_except GET HEAD OPTIONS { deny all; }
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=static burst=60 nodelay;
			proxy_pass $upstream;
		}
		location ^~ /assets/hrms/images/ {
			limit_except GET HEAD OPTIONS { deny all; }
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=static burst=60 nodelay;
			proxy_pass $upstream;
		}
		# Public employee avatars (read-only; /private/* stays denied).
		location ^~ /files/ {
			limit_except GET HEAD OPTIONS { deny all; }
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=static burst=60 nodelay;
			proxy_pass $upstream;
		}

		# ── Reserved words must never look like booking slugs ─────────
		# (this block must stay BEFORE the short-link block: regex
		# locations win in file order).
		location ~ ^/(app|login|desk|admin|dashboard|api|assets|files|hrms|private|socket\.io|login\.html)(/.*)?$ {
			return 403;
		}

		# ── Short public links: /<slug> serves the booking page ────
		# Single path segment only; everything else still falls to deny.
		# ^~ blocks above (assets/api/files/hrms) take precedence.
		# Silent internal rewrite (URL stays short): the SPA router runs
		# from root on this host and resolves /:slug to the booking page.
		location ~ ^/(?<shortslug>[A-Za-z0-9_-]+)/?$ {
			limit_except GET HEAD OPTIONS { deny all; }
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=page burst=10 nodelay;
			rewrite ^ /hrms/book/$shortslug break;
			proxy_pass $upstream;
		}

		# ── Single-use booking links: /<slug>/<token> ──────────
		# Exactly two path segments; single-segment block above cannot match
		# (anchored). Same silent internal rewrite: the SPA router runs from
		# root on this host and resolves /:slug/:token to the booking page
		# with the token. The gateway stays stateless; token single-use is
		# enforced server-side.
		location ~ ^/(?<linkslug>[A-Za-z0-9_-]+)/(?<linktoken>[A-Za-z0-9_-]+)/?$ {
			limit_except GET HEAD OPTIONS { deny all; }
			if ($request_method = OPTIONS) { return 204; }
			limit_req zone=page burst=10 nodelay;
			rewrite ^ /hrms/book/$linkslug/$linktoken break;
			proxy_pass $upstream;
		}

		location = /robots.txt {
			return 204;
		}

		# ── Deny everything else ─────────────────────────────
		location / {
			return 403;
		}
	}
}
