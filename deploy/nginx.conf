upstream backend-server {
	server backend:8000 fail_timeout=0;
}

upstream socketio-server {
	server websocket:9000 fail_timeout=0;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
	default $scheme;
	https https;
}

# Authenticate browser origin before normalizing the internal realtime hop.
map "$http_origin|$host" $hrms_socket_explicit_origin {
	default 0;
	"https://hr.realtyna.com|hr.realtyna.com" 1;
}

# Same-origin polling GETs can omit Origin; browser Fetch Metadata is required.
map "$http_origin|$http_sec_fetch_site|$host" $hrms_socket_same_origin_fetch {
	default 0;
	"|same-origin|hr.realtyna.com" 1;
}

map "$hrms_socket_explicit_origin|$hrms_socket_same_origin_fetch" $hrms_socket_origin_allowed {
	default 0;
	"1|0" 1;
	"0|1" 1;
	"1|1" 1;
}

server {
	listen 8080;
	server_name frontend;
	absolute_redirect off;
	root /home/frappe/frappe-bench/sites;
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;
	include /etc/nginx/snippets/security_headers.conf;
	set_real_ip_from 127.0.0.1;
	real_ip_header X-Forwarded-For;
	real_ip_recursive off;

	location = /assets/hrms/frontend/sw.js {
		add_header Service-Worker-Allowed /hrms/;
		try_files $uri =404;
	}

	location /assets {
		try_files $uri =404;
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /frontend/$1 =404;
	}

	location /socket.io {
		if ($hrms_socket_origin_allowed = 0) {
			return 403;
		}
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name frontend;
		# Frappe authenticates against Origin; keep that fetch on the private network.
		proxy_set_header Origin http://frontend:8080;
		proxy_set_header Host frontend:8080;
		proxy_pass http://socketio-server;
	}

	location / {
		rewrite ^(.+)/$ $1 permanent;
		rewrite ^(.+)/index\.html$ $1 permanent;
		rewrite ^(.+)\.html$ $1 permanent;
		location ~ ^/files/.*.(htm|html|svg|xml) {
			include /etc/nginx/snippets/security_headers.conf;
			add_header Content-disposition "attachment";
			try_files /frontend/public/$uri @webserver;
		}
		try_files /frontend/public/$uri @webserver;
	}

	location @webserver {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
		proxy_set_header X-Frappe-Site-Name frontend;
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;
		proxy_pass http://backend-server;
	}

	sendfile on;
	keepalive_timeout 15;
	client_max_body_size 50m;
	client_body_buffer_size 16K;
	client_header_buffer_size 1k;
	gzip on;
	gzip_http_version 1.1;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types application/atom+xml application/javascript application/json
		application/rss+xml application/vnd.ms-fontobject application/x-font-ttf
		application/font-woff application/x-web-app-manifest+json application/xhtml+xml
		application/xml font/opentype image/svg+xml image/x-icon text/css text/plain
		text/x-component;
}
